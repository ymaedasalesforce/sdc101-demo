<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data 360 Mock Tester</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0176d3; color: white; border: none; cursor: pointer; }
        #status { margin-top: 15px; padding: 10px; display: none; }
        .success { background: #e7f4e8; color: #2e7d32; }
        .error { background: #fdf0ed; color: #ea001e; }
    </style>
</head>
<body>
<div class="card">
    <h3>Data 360 モック送信 (プロキシ版)</h3>
    <div class="form-group">
        <label>エンドポイントURL</label>
        <input type="text" id="endpoint" placeholder="https://...">
    </div>
    <div class="form-group">
        <label>appSourceId</label>
        <input type="text" id="appSourceId">
    </div>
    <div class="form-group">
        <label>JSON ペイロード</label>
        <textarea id="payload" rows="5">{"eventType": "track", "payload": {}}</textarea>
    </div>
    <button onclick="sendData()">送信</button>
    <div id="status"></div>
</div>

<script>
function sendData() {
    const url = document.getElementById('endpoint').value;
    const appSourceId = document.getElementById('appSourceId').value;
    const payload = JSON.parse(document.getElementById('payload').value);
    
    // プロキシURLを付与
    const proxyUrl = "https://herokuapp.com";
    
    fetch(proxyUrl + url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest" },
        body: JSON.stringify({ ...payload, appSourceId, eventTime: new Date().toISOString() })
    })
    .then(r => showStatus(r.ok ? "成功" : "失敗", r.ok ? "success" : "error"))
    .catch(e => showStatus("通信エラー", "error"));
}
function showStatus(msg, type) {
    const s = document.getElementById('status');
    s.innerText = msg; s.className = type; s.style.display = "block";
}
</script>
</body>
</html>
